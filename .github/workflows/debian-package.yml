name: Debian package

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            debhelper \
            devscripts \
            lintian \
            meson \
            ninja-build \
            pkg-config \
            libglib2.0-dev \
            libjson-glib-dev \
            libssl-dev \
            libtss2-dev \
            fprintd

      - name: Build Debian package
        run: dpkg-buildpackage -us -uc -b

      - name: Inspect package contents and service hardening
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find .. -maxdepth 1 -type f -name 'linux-webauthn_*.deb' -print -quit)"
          test -n "$deb"

          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"

          contents="$(dpkg-deb --contents "$deb")"
          for required in \
            './usr/bin/linux-webauthn' \
            './usr/share/dbus-1/services/org.linux.WebAuthn.service' \
            './usr/lib/systemd/user/linux-webauthn.service' \
            './usr/lib/systemd/user/default.target.wants/linux-webauthn.service' \
            './usr/lib/udev/rules.d/70-linux-webauthn.rules'; do
            grep -Fq "$required" <<<"$contents" || {
              echo "ERROR: missing required package file: $required" >&2
              exit 1
            }
          done

          # Inspect the actual unit shipped in the .deb, not just the source template.
          workdir="$(mktemp -d)"
          dpkg-deb -x "$deb" "$workdir/root"
          unit="$workdir/root/usr/lib/systemd/user/linux-webauthn.service"
          test -f "$unit"
          for directive in \
            'ExecStartPre=' \
            'NoNewPrivileges=yes' \
            'PrivateTmp=yes' \
            'UMask=0077' \
            'ProtectSystem=full' \
            'ProtectKernelTunables=yes' \
            'ProtectKernelModules=yes' \
            'ProtectControlGroups=yes' \
            'LockPersonality=yes' \
            'MemoryDenyWriteExecute=yes' \
            'RestrictSUIDSGID=yes' \
            'RestrictRealtime=yes' \
            'RestrictAddressFamilies=AF_UNIX'; do
            grep -Fq "$directive" "$unit" || {
              echo "ERROR: packaged systemd unit missing: $directive" >&2
              exit 1
            }
          done
          test "$(grep -Fc 'ExecStart=' "$unit")" -eq 1

          # The Debian helper must generate user-service lifecycle handling.
          dpkg-deb -e "$deb" "$workdir/control"
          test -f "$workdir/control/postinst"
          grep -Fq 'deb-systemd-helper' "$workdir/control/postinst"

          # The package must contain exactly one WebAuthn udev rule.
          test "$(grep -Fc '/usr/lib/udev/rules.d/' <<<"$contents")" -eq 1

      - name: Lint package
        run: |
          deb="$(find .. -maxdepth 1 -type f -name 'linux-webauthn_*.deb' -print -quit)"
          lintian --tag-display-limit 0 \
            --suppress-tags no-copyright,appstream-metadata-missing-modalias-provide,debian-changelog-line-too-long \
            "$deb"

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: linux-webauthn-deb
          path: ../linux-webauthn_*.deb
          if-no-files-found: error
