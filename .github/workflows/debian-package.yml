name: Debian package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debhelper \
            devscripts \
            meson \
            ninja-build \
            pkg-config \
            libglib2.0-dev \
            libjson-glib-dev \
            libssl-dev \
            libtss2-dev \
            fprintd

      - name: Build Debian package
        run: dpkg-buildpackage -us -uc -b

      - name: Inspect package
        run: |
          dpkg-deb --info ../linux-webauthn_*.deb
          dpkg-deb --contents ../linux-webauthn_*.deb

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: linux-webauthn-deb
          path: ../linux-webauthn_*.deb
          if-no-files-found: error
