name: Debian package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debhelper \
            devscripts \
            lintian \
            meson \
            ninja-build \
            pkg-config \
            libglib2.0-dev \
            libjson-glib-dev \
            libssl-dev \
            libtss2-dev \
            fprintd

      - name: Build Debian package
        run: dpkg-buildpackage -us -uc -b

      - name: Inspect package contents
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find .. -maxdepth 1 -type f -name 'linux-webauthn_*.deb' -print -quit)"
          test -n "$deb"

          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"

          contents="$(dpkg-deb --contents "$deb")"
          for required in \
            './usr/bin/linux-webauthn' \
            './usr/share/dbus-1/services/org.linux.WebAuthn.service' \
            './usr/lib/systemd/user/linux-webauthn.service' \
            './usr/lib/systemd/user/default.target.wants/linux-webauthn.service' \
            './usr/lib/udev/rules.d/70-linux-webauthn.rules'; do
            grep -Fq "$required" <<<"$contents" || {
              echo "ERROR: missing required package file: $required" >&2
              exit 1
            }
          done

          workdir="$(mktemp -d)"
          dpkg-deb -e "$deb" "$workdir/control"
          test -f "$workdir/control/postinst"
          grep -Fq 'deb-systemd-helper' "$workdir/control/postinst"

      - name: Lint package
        run: |
          deb="$(find .. -maxdepth 1 -type f -name 'linux-webauthn_*.deb' -print -quit)"
          lintian --no-tag-display-limit "$deb"

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: linux-webauthn-deb
          path: ../linux-webauthn_*.deb
          if-no-files-found: error
