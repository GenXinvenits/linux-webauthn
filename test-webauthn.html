<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Linux WebAuthn Resident Credential Test</title>
</head>
<body>
<h2>Linux WebAuthn — Resident Credential Test</h2>
<button id="register">Register resident credential</button>
<button id="authenticate">Authenticate with resident credential</button>
<pre id="out">Ready.</pre>

<script>
const out = document.getElementById("out");
const log = (...args) => { out.textContent += "\n" + args.join(" "); };
const b64url = bytes => {
  const data = bytes instanceof ArrayBuffer ? new Uint8Array(bytes) : bytes;
  let s = "";
  for (const b of data) s += String.fromCharCode(b);
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
};
const fromB64url = value => {
  const padded = value.replace(/-/g, "+").replace(/_/g, "/") + "===";
  const s = atob(padded.slice(0, padded.length - (padded.length % 4)));
  return Uint8Array.from(s, c => c.charCodeAt(0));
};

const RP = { id: "localhost", name: "Linux WebAuthn Test" };

/* Generate a fresh WebAuthn user handle for every registration. */
function makeUser() {
  const id = new Uint8Array(16);
  crypto.getRandomValues(id);
  const suffix = b64url(id).slice(0, 8);
  return {
    id,
    name: `linux-webauthn-${suffix}`,
    displayName: `Linux WebAuthn Test User ${suffix}`
  };
}

async function getJson(path) {
  const response = await fetch(path, { cache: "no-store" });
  const body = await response.json();
  if (!response.ok)
    throw new Error(body.error || `HTTP ${response.status}`);
  return body;
}

async function postJson(path, body) {
  const response = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  const result = await response.json();
  if (!response.ok)
    throw new Error(result.error || `HTTP ${response.status}`);
  return result;
}

async function register() {
  out.textContent = "Requesting registration challenge from server...";
  const options = await getJson("/webauthn/register-options");
  const challenge = fromB64url(options.challenge);
  const user = makeUser();

  const credential = await navigator.credentials.create({
    publicKey: {
      rp: { id: options.rpId, name: options.rpName },
      user,
      challenge,
      pubKeyCredParams: [{ type: "public-key", alg: -7 }],
      authenticatorSelection: {
        residentKey: "required",
        requireResidentKey: true,
        userVerification: "required"
      },
      timeout: 60000,
      attestation: "none"
    }
  });

  if (!credential) throw new Error("No credential returned");

  const publicKey = credential.response.getPublicKey();
  if (!publicKey)
    throw new Error("Browser did not expose the credential public key");

  const result = await postJson("/webauthn/register", {
    credentialId: b64url(credential.rawId),
    clientDataJSON: b64url(credential.response.clientDataJSON),
    authenticatorData: b64url(credential.response.getAuthenticatorData()),
    publicKey: b64url(publicKey)
  });

  out.textContent = "Browser resident-credential registration + server verification succeeded.";
  log("credential ID:", b64url(credential.rawId));
  log("user:", user.name);
  log("authenticatorData bytes:", credential.response.getAuthenticatorData().byteLength);
  log("server:", result.message);
  log("stored credentials:", result.storedCredentials);
  log("counter:", result.counter);
  log("Tip: register again to create a second discoverable credential for the same RP.");
}

async function authenticate() {
  out.textContent = "Requesting authentication challenge from server...";
  const options = await getJson("/webauthn/authenticate-options");
  const challenge = fromB64url(options.challenge);

  /* No allowCredentials: force discoverable-credential selection. */
  const assertion = await navigator.credentials.get({
    publicKey: {
      rpId: options.rpId,
      challenge,
      userVerification: "required",
      timeout: 60000
    }
  });

  if (!assertion) throw new Error("No assertion returned");

  const result = await postJson("/webauthn/authenticate", {
    credentialId: b64url(assertion.rawId),
    clientDataJSON: b64url(assertion.response.clientDataJSON),
    authenticatorData: b64url(assertion.response.authenticatorData),
    signature: b64url(assertion.response.signature)
  });

  out.textContent = "Browser resident-credential authentication + server verification succeeded.";
  log("credential ID:", b64url(assertion.rawId));
  log("authenticatorData bytes:", assertion.response.authenticatorData.byteLength);
  log("signature bytes:", assertion.response.signature.byteLength);
  log("RP ID hash:", result.rpIdHash);
  log("UP flag:", result.up);
  log("UV flag:", result.uv);
  log("counter:", `${result.previousCounter} -> ${result.counter}`);
  log("signature:", result.signature);
}

document.getElementById("register").onclick = () =>
  register().catch(e => {
    out.textContent = "REGISTER ERROR: " + e.name + "\n" + e.message;
    console.error(e);
  });

document.getElementById("authenticate").onclick = () =>
  authenticate().catch(e => {
    out.textContent = "AUTHENTICATE ERROR: " + e.name + "\n" + e.message;
    console.error(e);
  });
</script>
</body>
</html>
